name: probe
on: {push: {branches: [probe-espn]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          def g(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20))
          E="https://site.api.espn.com/apis/site/v2/sports/soccer"
          for lg,d in (("eng.1","20261128"),("uefa.champions","20261125"),("pol.1","20261128"),("arg.1","20261128")):
              try:
                  sb=g(f"{E}/{lg}/scoreboard?dates={d}")
              except Exception as e:
                  print(lg,"ERR",e); continue
              ev=sb["events"][0]; c=ev["competitions"][0]["competitors"]
              print(lg,ev["name"],[(x["team"]["id"],x["team"]["displayName"],x["homeAway"]) for x in c])
              tid=c[0]["team"]["id"]
              try:
                  s=g(f"{E}/{lg}/teams/{tid}/schedule")
                  evs=s.get("events",[])
                  done=[(e["date"][:10],e["id"],e["name"],e["competitions"][0]["status"]["type"].get("completed")) for e in evs]
                  print("  sched",len(evs),done[-4:])
                  le=[e for e in evs if e["competitions"][0]["status"]["type"].get("completed")]
                  if le: print("  leagueSlug in event?", le[-1].get("league"), list(le[-1].keys()))
              except Exception as e:
                  print("  sched ERR",e)
          PY
