name: probe
on: {push: {branches: [probe-espn]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request
          def g(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20))
          E="https://site.api.espn.com/apis/site/v2/sports/soccer"
          C="https://sports.core.api.espn.com/v2/sports/soccer/leagues"
          for lg,d in (("eng.1","20261122"),("esp.1","20261122")):
              sb=g(f"{E}/{lg}/scoreboard?dates={d}")
              ev=[e for e in sb["events"] if e["status"]["type"].get("completed")][0]
              j=g(f"{E}/{lg}/summary?event={ev['id']}")
              t=j["rosters"][0]; tid=t["team"]["id"]
              gr=[p for p in t["roster"] if p.get("starter")][3]
              aid=gr["athlete"]["id"]; print(lg,ev["name"],gr["athlete"]["displayName"],aid)
              for u in (f"{C}/{lg}/events/{ev['id']}/competitions/{ev['id']}/competitors/{tid}/roster/{aid}/statistics/0",
                        f"{C}/{lg}/events/{ev['id']}/competitions/{ev['id']}/competitors/{tid}/roster"):
                  try:
                      r=g(u); print(" OK",u.split("competitors")[1])
                      for c in r.get("splits",{}).get("categories",[]):
                          print("   ",c.get("name"),[(x["name"],x.get("value")) for x in c.get("stats",[])])
                      if "entries" in r: print("   entries",len(r["entries"]),json.dumps(r["entries"][0])[:400])
                  except Exception as e: print(" ERR",u.split("competitors")[1],e)
          PY
