name: Prognozy

on:
  schedule:
    # Godziny polskie: tydzień 8, 18, 23; weekend 10, 13, 16, 18, 20, 23.
    # GitHub liczy w UTC, a Polska ma czas zimowy/letni, więc startujemy w obu wariantach,
    # a krok "czas" przepuszcza tylko właściwą godzinę.
    - cron: "5 6,7,16,17,21,22 * * 1-5"
    - cron: "5 8,9,11,12,14,15,16,17,18,19,21,22 * * 0,6"
  workflow_dispatch:          # przycisk "Run workflow" = ręczne odświeżenie

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  czas:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          TZ: Europe/Warsaw
          ZDARZENIE: ${{ github.event_name }}
        run: |
          H=$(date +%-H); D=$(date +%u)
          if [ "$D" -ge 6 ]; then GODZ="10 13 16 18 20 23"; else GODZ="8 18 23"; fi
          OK=false
          [ "$ZDARZENIE" != "schedule" ] && OK=true
          for g in $GODZ; do [ "$H" = "$g" ] && OK=true; done
          echo "Godzina w Polsce: $H (dzień $D), plan: $GODZ -> uruchamiam: $OK"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
  build:
    needs: czas
    if: needs.czas.outputs.ok == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteki
        run: pip install pywebpush
      - uses: actions/cache@v4
        with:
          path: |
            cache_api.json
            historia.json
          key: cache-api-${{ github.run_id }}
          restore-keys: cache-api-
      - name: Generuj strone
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
        run: |
          mkdir -p strona
          python prognozy_pilka.py --dni 3 --max-proc 85 --nie-otwieraj --kursy-co 48 --backtest 200 \
            --html strona/index.html \
            --odswiez-url "https://github.com/${{ github.repository }}/actions/workflows/prognozy.yml"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
